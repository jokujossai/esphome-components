esphome:
  name: epaper-spi-uc8179-bwr-test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../../../components
    components:
      - epaper_spi

spi:
  clk_pin: 13
  mosi_pin: 14

display:
  - platform: epaper_spi
    model: waveshare-7.5in-bv2-bwr
    cs_pin: 15
    dc_pin: 27
    busy_pin: 25
    reset_pin: 26
    full_update_every: 30
    update_interval: never
    lambda: |-
      it.fill(Color(255, 255, 255));
      it.line(0, 0, it.get_width() - 1, it.get_height() - 1, Color(0, 0, 0));
      it.printf(20, 20, nullptr, Color(255, 0, 0), "Red text");
