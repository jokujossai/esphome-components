esphome:
  name: panasonic_aquarea

external_components:
  - source:
      type: local
      path: ../components
    components:
      - panasonic_aquarea

esp8266:
  board: d1_mini

# Enable logging
logger:
  # Disable logging to serial
  baud_rate: 0

# Enable HA API
#api:
#  encryption:
#    key: !secret api_key

# Enable OTAs
ota:
  - platform: esphome
    password: !secret ota_password

# Wi-Fi setup
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case Wi-Fi connection fails
  ap:
    ssid: panasonic_aquarea AP
#    password: !secret ap_password

captive_portal:

web_server:

# HeishaMon PCB uses swapped UART pins (Serial.swap() equivalent)
uart:
  tx_pin: GPIO15
  rx_pin: GPIO13
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1

# Enable Panasonic Aquarea
panasonic_aquarea:
  # listen_only: false
  # protocols: [main]

switch:
  # HeishaMon ENABLEPIN - controls TX level shifter MOSFET
  - platform: gpio
  # HIGH = TX enabled, LOW = listen-only (TX floats)
    pin: GPIO5
    id: uart_tx_enable
    restore_mode: ALWAYS_ON

  - platform: panasonic_aquarea
    field: heatpumpState
  - platform: panasonic_aquarea
    field: forceDhwState
  - platform: panasonic_aquarea
    field: dhwModeState

sensor:
  - platform: panasonic_aquarea
    field: pumpFlow

binary_sensor:
  - platform: status
    name: AA Node Status
  - platform: panasonic_aquarea
    field: heatpumpState

select:
  - platform: panasonic_aquarea
    field: operatingModeState
