esphome:
  name: panasonic_aquarea

external_components:
  - source:
      type: local
      path: ../components
    components:
      - panasonic_aquarea

esp8266:
  board: d1_mini

# Enable logging
logger:
  # Disable logging to serial
  baud_rate: 0

# Enable HA API
#api:
#  encryption:
#    key: !secret api_key

# Enable OTAs
ota:
  - platform: esphome
    password: !secret ota_password

# Wi-Fi setup
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case Wi-Fi connection fails
  ap:
    ssid: panasonic_aquarea AP
#    password: !secret ap_password

captive_portal:

web_server:

# HeishaMon PCB uses swapped UART pins (Serial.swap() equivalent)
uart:
  - id: aquarea_uart
    tx_pin: GPIO15
    rx_pin: GPIO13
    baud_rate: 9600
    data_bits: 8
    parity: EVEN
    stop_bits: 1

# (Optional) HeishaMon PCB has a DS18B20 1-Wire bus on GPIO4
# one_wire:
#   - platform: gpio
#     pin: GPIO4

# Enable Panasonic Aquarea
panasonic_aquarea:
  - listen_only: false
    protocols: [main, main_request]
    data_source:
      uart:
        uart_id: aquarea_uart

switch:
  # HeishaMon ENABLEPIN - controls TX level shifter MOSFET
  - platform: gpio
  # HIGH = TX enabled, LOW = listen-only (TX floats)
    pin: GPIO5
    id: uart_tx_enable
    restore_mode: ALWAYS_ON

