substitutions:
  device_name: "panasonic-aquarea-openeth-mqtt"
  panasonic_aquarea_id: "aquarea"
  # Zone 1 request temp ranges
  z1_heat_request_temp_min: "-5"
  z1_heat_request_temp_max: "5"
  z1_cool_request_temp_min: "-5"
  z1_cool_request_temp_max: "5"
  # Zone 2 request temp ranges
  z2_heat_request_temp_min: "-5"
  z2_heat_request_temp_max: "5"
  z2_cool_request_temp_min: "-5"
  z2_cool_request_temp_max: "5"

packages:
  # Uses its own base (ESP32 + OpenETH + MQTT data source) instead of
  # heishamon/base.yaml (ESP8266 + WiFi + UART), but reuses all the
  # entity packages unchanged.
  common: !include heishamon/common.yaml
  zone1_cool: !include heishamon/zone1_cool.yaml
  zone2: !include heishamon/zone2.yaml
  zone2_cool: !include heishamon/zone2_cool.yaml
  bivalent: !include heishamon/bivalent.yaml
  optional_solar: !include heishamon/optional_solar.yaml
  optional_buffer: !include heishamon/optional_buffer.yaml
  optional_external: !include heishamon/optional_external.yaml

esphome:
  name: ${device_name}

external_components:
  - source:
      type: local
      path: ../../components
    components:
      - panasonic_aquarea

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

ethernet:
  type: OPENETH

web_server:

mqtt:
  id: mqtt1
  broker: !secret panasonic_aquarea_mqtt_host
  port: !secret panasonic_aquarea_mqtt_port
  username: !secret panasonic_aquarea_mqtt_username
  password: !secret panasonic_aquarea_mqtt_password
  discovery: false
  discover_ip: false
  log_topic: null
  clean_session: true

panasonic_aquarea:
  - id: ${panasonic_aquarea_id}
    #listen_only: true
    data_source:
      type: mqtt
      mqtt_id: mqtt1
      subscribe_topic: panasonic_heat_pump/raw/data
      publish_topic: panasonic_heat_pump/raw/esphome_output
