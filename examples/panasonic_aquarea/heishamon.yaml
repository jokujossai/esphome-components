substitutions:
  device_name: "heishamon"
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ota_password: !secret ota_password
  ap_password: !secret ap_password
  panasonic_aquarea_id: "aquarea"
  # Direct mode temperature limits — depend on heat pump model.
  # WH-UD: 20-55, WH-UH: 25-65 or 35-65, WH-UX/UQ: 20-60.
  # Only used by climate and number entities in direct mode;
  # compensation curve mode always uses -5..+5 automatically.
  heat_direct_temp_min: "20"
  heat_direct_temp_max: "55"
  # Zone 1 number entity request temp ranges
  # Compensation curve mode (default): -5 to 5
  # Direct mode: depends on model (e.g. 20-55, 25-60, 35-65)
  z1_heat_request_temp_min: "-5"
  z1_heat_request_temp_max: "5"
  z1_cool_request_temp_min: "-5"
  z1_cool_request_temp_max: "5"
  # Zone 2 number entity request temp ranges (same logic as zone 1)
  z2_heat_request_temp_min: "-5"
  z2_heat_request_temp_max: "5"
  z2_cool_request_temp_min: "-5"
  z2_cool_request_temp_max: "5"

packages:
  base: !include packages/heishamon/base.yaml
  common: !include packages/heishamon/common.yaml
  # (Optional) Enable zone 1 cooling entities
  #zone1_cool: !include packages/heishamon/zone1_cool.yaml
  # (Optional) Enable zone 2 entities
  #zone2: !include packages/heishamon/zone2.yaml
  # (Optional) Enable zone 2 cooling entities
  #zone2_cool: !include packages/heishamon/zone2_cool.yaml
  # (Optional) Enable bivalent heater entities
  #bivalent: !include packages/heishamon/bivalent.yaml
  # (Optional) Enable solar entities
  #optional_solar: !include packages/heishamon/optional_solar.yaml
  # (Optional) Enable buffer tank entities
  #optional_buffer: !include packages/heishamon/optional_buffer.yaml
  # (Optional) Enable external thermostat entities
  #optional_external: !include packages/heishamon/optional_external.yaml
  # (Optional) Enable zone 1 climate card (target temp + mode in HA)
  #climate_zone1: !include
  #  file: packages/climate.yaml
  #  vars:
  #    zone: "1"
  #    direct_min_value: ${heat_direct_temp_min}
  #    direct_max_value: ${heat_direct_temp_max}
  # (Optional) Enable extra protocol fields (K/L series and newer models)
  #extra: !include packages/heishamon/extra.yaml
  # (Optional) Enable 1-Wire bus
  #one_wire: !include packages/heishamon/one_wire.yaml
  # (Optional) Add 1-Wire sensor/sensors
  #one_wire_sensor_1: !include
  #  file: packages/heishamon/one_wire_sensor.yaml
  #  vars:
  #    one_wire_sensor_address: "0x1234567890abcdef"
  #    one_wire_sensor_name: "Tank Top"
  # (Optional) Enable S0 pulse counters
  #s0: !include packages/heishamon/s0.yaml

# (Optional) Enable native api
# api:
#   encryption:
#     key: ...
